<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #4ade80;
            margin-bottom: 20px;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 My Application</h1>
        <p>Welcome to my mini app!</p>
    </div>

    <div class="card">
        <div class="status">✅ Frontend: Working</div>
        <div class="status">✅ Backend: Ready</div>
        <div class="status">✅ Database: PostgreSQL</div>
    </div>

    <div class="card">
        <h3>Next Steps:</h3>
        <p>1. Create Telegram Bot</p>
        <p>2. Connect Real Backend</p>
        <p>3. Add Database</p>
    </div>
</body>
</html>
